server:
  port: 8090

spring:
  application:
    name: flowlink-platform
  # 默认零依赖可跑：内存 H2 + 内存特征存储；生产切 PostgreSQL/Redis（见 application-prod.yml 说明）
  datasource:
    url: jdbc:h2:mem:flowlink;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      # 默认零依赖模式（app.feature-store=memory）下，Redis 根本没被使用，
      # 但 spring-boot-starter-data-redis 在 classpath 上会自动装配 RedisHealthIndicator。
      # 本机没起 Redis 时它报 DOWN，把整体健康度聚合成 503（本轮真实踩到）。
      # 内存模式不是 Redis 的客户端，不该被它摘流；默认关闭探针，需要时 REDIS_HEALTH_ENABLED=true 打开。
      # 生产 profile（application-prod.yml，feature-store=redis）再显式置 true。
      enabled: ${REDIS_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # 管理面（/api/v1/admin/**）使用的管理密钥：生产务必替换为强随机值并走密钥管理
  admin-key: flowlink-admin-key
  # 特征存储实现：memory（默认，零依赖）| redis
  feature-store: memory
  # 单租户每分钟评估配额（超出返回 429）
  default-quota-per-minute: 600
  # 引擎安全阀
  engine:
    max-rules-per-set: 500
    max-condition-depth: 8
    max-batch-size: 200
  # 幂等键缓存 TTL（秒）
  idempotency-ttl-seconds: 600
  # 审计
  audit:
    enabled: true
  # 启动时写入演示租户与示例规则集（便于开箱即用）
  bootstrap-demo-data: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
